[package]
name = "pwr-viewgen"
version = "0.1.0"
edition = "2021"
description = "Lightweight Discord embed generator: webhook message JSON to HTML/PNG preview"

[features]
default = ["cli", "png"]
cli = []
serve = ["dep:axum", "tokio/net"]
png = ["dep:chromiumoxide", "dep:tokio", "dep:futures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pwr-ext = { path = "crates/pwr-ext" }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
chromiumoxide = { version = "0.7", optional = true }
futures = { version = "0.3", optional = true, default-features = false, features = ["std"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[workspace]
members = ["crates/pwr-ext"]
